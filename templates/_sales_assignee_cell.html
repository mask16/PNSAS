<td data-label="담당·대기순번" class="assignee-queue-cell sales-stack-cell sales-col-assignee{% if r.as_unassigned %} text-muted{% endif %}">
  <span class="assignee-queue-name">{{ r.as_display }}</span>
  {% if r.can_reassign_as %}
  <button type="button" class="receipt-edit-btn js-assign-as"
          data-no="{{ r.receipt_no }}"
          data-team="{{ r.handling_team_id or r.team_id }}"
          data-current="{{ r.as_staff or '' }}"
          {% set _ids = r.as_staff_ids if r.as_staff_ids else [] %}
          data-current-ids="{% if _ids %}{{ _ids|join(',') }}{% elif r.as_staff %}{{ r.as_staff }}{% endif %}"
          data-current-label="{{ r.as_display }}"
          data-can-multi="{{ '1' if r.can_multi_assign_as else '0' }}"
          data-customer="{{ r.customer_name }}"
          data-equipment="{{ r.equipment_name }}">지정·변경</button>
  {% if not r.transfer_pending_id and r.status != 'completed' and not is_rods %}
  <button type="button" class="receipt-edit-btn js-transfer-req"
          data-no="{{ r.receipt_no }}"
          data-team="{{ r.handling_team_id or r.team_id }}"
          data-customer="{{ r.customer_name }}"
          data-equipment="{{ r.equipment_name }}">이관</button>
  {% endif %}
  {% endif %}
  {% include '_queue_badge.html' %}
</td>
